name: IBKR Daily Brief

on:
  schedule:
    - cron: "45 3 * * 2-6"
  workflow_dispatch:

concurrency:
  group: ibkr-daily-brief
  cancel-in-progress: false

jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily brief
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_WAIT_FOR_FRESH_REPORT: "true"
          IBKR_MAX_WAIT_MINUTES: "120"
          IBKR_POLL_INTERVAL_SECONDS: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --send
